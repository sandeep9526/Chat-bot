version: "3.9"

services:
  backend:
    build:
      context: ./zeva-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./zeva-backend/.env
    environment:
      - APP_DATABASE_URL=postgresql://zeva_app:zeva_pass@postgres:5432/zeva
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./fortend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-in-production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://zeva_app:zeva_pass@postgres:5432/zeva
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zeva
      POSTGRES_USER: zeva_app
      POSTGRES_PASSWORD: zeva_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeva_app -d zeva"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
